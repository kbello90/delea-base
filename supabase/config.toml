# Supabase CLI project config. Applies to the shared project and every Enterprise project
# (TRD §2.3). Migrations live in ./migrations; pgTAP tests in ./tests.
#
# Local ports use 553xx instead of the CLI defaults (543xx): on Windows, Hyper-V/WinNAT often
# reserves the 543xx range (check with `netsh interface ipv4 show excludedportrange protocol=tcp`).
project_id = "delea-base"

[api]
enabled = true
port = 55321
# No application schema is exposed over the Data API (REST / GraphQL): every read and write
# goes through FastAPI (TRD §1.3). Exposing `public` would let any signed-in user write
# through PostgREST under RLS alone, bypassing the API's rules (server-computed totals,
# owner-only actions). The ai schema is never exposed (Schema §7). `public` is also kept out
# of the search path, so GraphQL can't reflect public tables either.
# Hosted projects: set the same in the dashboard's Data API settings (infra runbook).
schemas = ["graphql_public"]
extra_search_path = ["extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 55323

[local_smtp]
enabled = true
port = 55324

[analytics]
port = 55327

[db.pooler]
port = 55329

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5174"]
jwt_expiry = 3600
# Invite-only: nobody can create an account with the browser key. Accounts come from
# provisioning (admin API) and owner invites (POST /api/v1/members). backend/tests/
# test_auth_config.py fails if this is switched back on. Hosted: Dashboard -> Auth ->
# "Allow new users to sign up" off (infra/scripts/provision-enterprise.md).
enable_signup = false
minimum_password_length = 10

# Not the sign-up switch: [auth.email] enable_signup turns the whole email provider on or
# off, password sign-in included. Leave it on.
[auth.email]
enable_signup = true
# Invite and password-reset links: one-time, valid 24 hours (the setting covers both).
otp_expiry = 86400

# Links go straight to admin pages that verify the token_hash on submit, so email link
# scanners that fetch the page can't use up the token.
[auth.email.template.invite]
subject = "You're invited to {{ .Data.business_name }} on DELEA"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your DELEA password"
content_path = "./supabase/templates/recovery.html"

# Local only: the default (2 per hour) would stop the test suite. Mail goes to Mailpit.
[auth.rate_limit]
email_sent = 1000

# Custom access token hook that adds tenant_id and app_role claims (TRD §2.2).
# Defined in migrations/20261020000800_auth_hook.sql.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"
