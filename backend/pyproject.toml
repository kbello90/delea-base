[project]
name = "delea-backend"
version = "0.0.0"
description = "DELEA FastAPI backend (TRD §4)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.121,<1.0",  # Depends(scope="function")
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "pyjwt[crypto]>=2.10",
  "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.28",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs the local Supabase stack (npx supabase@2.121.0 start); skipped if unreachable",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
