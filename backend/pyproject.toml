[project]
name = "delea-backend"
version = "0.0.0"
description = "DELEA FastAPI backend (TRD §4)"
requires-python = ">=3.11"
dependencies = [
  # Exact pins: these three shape openapi.json, which CI checks for drift (see README).
  "fastapi==0.157.0",  # needs >=0.121 for Depends(scope="function")
  "starlette==1.9.0",
  "pydantic==2.14.1",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "pyjwt[crypto]>=2.10",
  "psycopg[binary,pool]>=3.2",
  "pillow==13.0.0",  # product image validation and WebP variants
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.28",
  "ruff>=0.8",
  "pyyaml>=6.0",  # showcase loader (showcase/products.yaml)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # the showcase package (tooling, not part of the app wheel)
markers = [
  "integration: needs the local Supabase stack (npx supabase@2.121.0 start); skipped if unreachable",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
