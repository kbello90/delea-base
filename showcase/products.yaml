# DELEA Showcase products. Edited by hand; read by backend/scripts/load_showcase.py.
#
# - folder: a subfolder of $SHOWCASE_DIR (never committed; no image ever lives in this repo).
# - images: filenames in that folder, in display order (at most 10). The first is the primary
#   image. Clean product shots first, text-heavy marketing graphics last.
# - stock: units on hand TODAY. The loader starts each product at stock + units sold in the
#   loaded history, so after the sales are replayed it ends exactly here.
# - prices are in dollars ("38.00"); the loader converts them to integer cents.
# - "needs-review" marks a guess. Descriptions use only what the photos or names show.
#
# Folders not used: "Birthstone Stud Earrings" (empty; its photos are in 7.earring),
# "Pendant Cursive" (its one image is a byte-identical copy of one in 5.initial letter),
# "pendant molde" (not in the product list).

products:
  - sku: DL-NK-LAYER-01
    folder: "1.Layered"
    name: Layered Open Circle Necklace
    description: >-
      Two fine gold-tone chains worn together, one plain and one finished with an open
      circle pendant. A simple layered look for every day.
    metal: other  # needs-review: gold tone; the metal list has no "gold plated" option
    price: "42.00"
    sale_price: null
    stock: 14
    low_stock_threshold: 4
    published: true
    images:
      - l3.png  # on the polishing cloth with the box
      - l2.png  # in hand
      - l1.png  # worn

  - sku: DL-NK-HEART-01
    folder: "2.Heart birth stone"
    name: Heart Birthstone Necklace
    description: >-
      A dainty gold-tone chain with a small heart-shaped stone. Shown in twelve stone
      colours, one for each birth month.
    metal: other  # needs-review: several filenames say "14k gold plated"
    price: "38.00"
    sale_price: "32.00"  # needs-review: shows the sale price in the list
    stock: 22
    low_stock_threshold: 5
    published: true
    images:  # 21 photos in the folder; 10 is the limit. Left out: the 11 single-colour
             # month shots on the brown backdrop except March (they read as colour options).
      - 3.png  # on the polishing cloth with the box
      - 2.png  # in hand
      - 1.png  # worn
      - "14 k gold plated heart 2.png"  # all colours, fanned out
      - "14k gold plated heart.jpg"  # all colours, on cream
      - 3 14k gold plated heart.jpg
      - "4  14k gold plated heart.jpg"  # two spaces in the filename
      - 1. heart march aquamarine.png
      - top test 1.jpg  # small DELEA logo in the corner
      - "catalog heart .png"  # text: month colour chart (a space before .png)

