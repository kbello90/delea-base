name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API types match the committed openapi.json
        run: |
          pnpm --filter @delea/api-client gen
          git diff --exit-code -- packages/api-client/src/schema.d.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: openapi.json matches the API
        run: |
          python scripts/dump_openapi.py
          git diff --exit-code -- ../packages/api-client/openapi.json
      - run: ruff check .
      - run: pytest

  database:
    name: Database (pgTAP) + backend integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE: npx -y supabase@2.121.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # Local stack only (no hosted project, no secrets). Studio and analytics aren't needed here;
      # Storage is (product images).
      - name: Start the local Supabase stack
        run: $SUPABASE start -x realtime,imgproxy,edge-runtime,logflare,vector,supavisor,studio

      - name: pgTAP tests
        run: $SUPABASE test db

      - name: Write backend/.env from the local demo keys
        run: $SUPABASE status -o env | python backend/scripts/write_local_env.py

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Backend tests including integration
        working-directory: backend
        env:
          # Fail instead of skipping if the stack is unreachable.
          DELEA_REQUIRE_INTEGRATION: "1"
        run: |
          pytest -m integration -rs
          pytest -rs

      - name: Stop the local stack
        if: always()
        run: $SUPABASE stop --no-backup
