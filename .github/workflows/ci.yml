name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API types match the committed openapi.json
        run: |
          pnpm --filter @delea/api-client gen
          git diff --exit-code -- packages/api-client/src/schema.d.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: openapi.json matches the API
        run: |
          python scripts/dump_openapi.py
          git diff --exit-code -- ../packages/api-client/openapi.json
      - run: ruff check .
      - run: pytest

  infra:
    name: Infrastructure (Bicep build + lint)
    runs-on: ubuntu-24.04
    # Offline: builds and lints the templates; never signs in to Azure or deploys anything.
    env:
      BICEP_VERSION: v0.46.1
      # The parameter files require these; placeholders, nothing real (no secret is ever a
      # parameter: secrets live in the Key Vault).
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_ANON_KEY: placeholder-public-anon-key
      DELEA_ADMIN_APP_URL: https://admin.placeholder.example
      DELEA_FORWARDED_ALLOW_IPS: 192.0.2.0/24
    steps:
      - uses: actions/checkout@v7
      - name: Install Bicep (pinned)
        run: |
          curl -fsSLo bicep "https://github.com/Azure/bicep/releases/download/${BICEP_VERSION}/bicep-linux-x64"
          chmod +x bicep
          ./bicep --version
      # Any warning fails the job, as an error does.
      - name: Build and lint the templates and every parameter file
        run: |
          set -o pipefail
          {
            ./bicep build infra/bicep/main.bicep --stdout > /dev/null
            ./bicep lint infra/bicep/main.bicep
            for p in infra/bicep/parameters/*.bicepparam; do
              ./bicep build-params "$p" --stdout > /dev/null
            done
          } 2>&1 | tee bicep.log
          if grep -E "Warning|Error" bicep.log; then exit 1; fi

  database:
    name: Database (pgTAP) + backend integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE: npx -y supabase@2.121.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # Local stack only (no hosted project, no secrets). Studio and analytics aren't needed here;
      # Storage is (product images). Docker Hub can refuse image pulls under its rate limit
      # ("toomanyrequests"), so starting is tried up to 3 times, clearing any half-started stack
      # and pausing in between. No registry credentials are used.
      - name: Start the local Supabase stack
        run: |
          for attempt in 1 2 3; do
            if $SUPABASE start -x realtime,imgproxy,edge-runtime,logflare,vector,supavisor,studio; then
              exit 0
            fi
            echo "::warning::Supabase start failed (attempt $attempt of 3)"
            $SUPABASE stop --no-backup || true
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          exit 1

      - name: pgTAP tests
        run: $SUPABASE test db

      - name: Write backend/.env from the local demo keys
        run: $SUPABASE status -o env | python backend/scripts/write_local_env.py

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Backend tests including integration
        working-directory: backend
        env:
          # Fail instead of skipping if the stack is unreachable.
          DELEA_REQUIRE_INTEGRATION: "1"
        run: |
          pytest -m integration -rs
          pytest -rs

      - name: Stop the local stack
        if: always()
        run: $SUPABASE stop --no-backup
